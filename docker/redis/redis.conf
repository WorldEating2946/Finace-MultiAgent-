# ==================================================
# FinaceAgent Redis 配置（Docker 挂载，原 deploy/redis.conf 迁移）
#
# 背景：Redis 只负责「哪个任务需要执行」的调度（PR43），任务状态以 PostgreSQL
# 为准。开启 AOF 后把「重启丢队列」窗口从 RDB 快照的 ≤1h 降到 ≤1s，
# 降低任务丢失窗口（对崩溃恢复的语义是「更快被捡起」，不是状态真相）。
# ==================================================

# 数据目录（挂载到 redis_data 卷）
dir /data

# AOF 持久化：每个写命令追加日志（everysec = 每秒 fsync，崩溃最多丢 1s）
appendonly yes
appendfsync everysec

# 关闭 RDB 快照，避免与 AOF 双写磁盘（AOF 已覆盖持久化）
save ""

# ── Docker 容器内访问配置 ─────────────────────────────────
# 容器内绑定所有接口，供宿主机 / 其他容器通过映射端口访问
bind 0.0.0.0
protected-mode no
